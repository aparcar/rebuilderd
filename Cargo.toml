[workspace]
members = [
    "common",
    "daemon",
    "tests",
    "tools",
    "worker",
]
resolver = "2"

# TEMPORARY: the `pqc` feature needs ML-DSA support in in-toto-rs, which is not
# released yet. Replace with a git dependency once the fork is pushed, and drop
# entirely once https://github.com/in-toto/in-toto-rs merges it.
[patch.crates-io]
in-toto = { path = "../in-toto-rs" }

[workspace.dependencies]
rand = "0.10"
rebuilderd = { version = "=0.28.0", path = "daemon" }
rebuilderd-common = { version = "=0.28.0", path = "common" }
toml = "1"
